ekf_filter_node:
  ros__parameters:
    frequency: 20.0 # Try 20Hz; if it still fails, go back to 10Hz but optimize elsewhere
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    imu0: /imu/data_raw
    # Only use Angular Velocity and Linear Acceleration
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true,  true,  true,
                  true,  true,  true]
    imu0_differential: true 
    imu0_remove_gravitational_acceleration: true
# Motor Speed Configuration
# Edit these values to adjust robot speeds for exploration and testing

# LiDAR Explorer speeds (used during SLAM bootstrapping)
lidar_explorer:
  forward_speed: 0.15        # m/s (0.1=slow, 0.2=medium, 0.3=fast)
  turn_speed: 0.5            # rad/s (0.3=slow, 0.5=medium, 0.8=fast)
  obstacle_distance: 0.5     # meters - stop distance
  safe_distance: 0.8         # meters - slow down distance

# Arduino Motor Bridge PWM limits
# (affects max speed of all /cmd_vel commands)
arduino_motor_bridge:
  max_speed: 200             # PWM 0-255 (255=max hardware speed)
  min_pwm: 70                # minimum PWM to overcome friction
  velocity_deadband: 0.03    # m/s - commands below this become 0
  wheel_base: 0.18           # meters - distance between wheels

# Navigation speeds
nav2:
  max_linear_velocity: 0.3   # m/s
  max_angular_velocity: 1.0  # rad/s

# Quick Test Commands (copy & paste into terminal):
# 
# Test forward: ros2 run localization motor_speed_tester
#   Then type: f 0.2
#
# Quick speeds from launch:
#   ros2 launch fea_slam robot_full.launch.py exploration:=true
